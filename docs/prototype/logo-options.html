<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TangWong · Logo Directions</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Noto+Sans+Thai:wght@600;700;800&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Plus Jakarta Sans', 'Noto Sans Thai', sans-serif;
    background: radial-gradient(120% 80% at 50% -10%, #141B2E 0%, #0C111D 55%, #080B14 100%);
    color: #fff; min-height: 100vh; padding: 44px 24px 80px;
  }
  .th { font-family: 'Noto Sans Thai', sans-serif; }
  .wrap { max-width: 1180px; margin: 0 auto; }
  .head { text-align: center; margin-bottom: 8px; }
  .kicker { font-size: 12px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; color: #6D5EF9; }
  h1 { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; margin-top: 6px; }
  .sub { color: #93A0B7; font-size: 15px; margin-top: 8px; line-height: 1.55; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; margin-top: 38px; }
  .card {
    background: rgba(31,41,55,0.5); border: 1px solid rgba(255,255,255,0.09);
    border-radius: 22px; padding: 24px; backdrop-filter: blur(16px);
    display: flex; flex-direction: column; gap: 20px;
  }
  .card.pick { border-color: rgba(109,94,249,0.6); box-shadow: 0 0 0 1px rgba(109,94,249,0.4), 0 18px 50px -20px rgba(109,94,249,0.5); }
  .card-top { display: flex; align-items: center; justify-content: space-between; }
  .opt-name { font-size: 18px; font-weight: 800; letter-spacing: -0.01em; }
  .opt-desc { font-size: 13px; color: #93A0B7; line-height: 1.5; }
  .badge { font-size: 10.5px; font-weight: 800; letter-spacing: 0.06em; padding: 5px 10px; border-radius: 8px; background: #6D5EF9; color: #fff; }
  .row { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
  .specimen { display: flex; align-items: center; gap: 26px; padding: 22px; border-radius: 16px;
    background: rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.06); }
  .specimen.light { background: #EEF1FA; }
  .tile { border-radius: 28%; position: relative; flex-shrink: 0;
    box-shadow: 0 10px 26px -8px rgba(109,94,249,0.6); }
  .lockup { display: flex; align-items: center; gap: 12px; }
  .word { display: flex; flex-direction: column; line-height: 1; }
  .word .name { font-size: 24px; font-weight: 800; letter-spacing: -0.01em; }
  .word .en { font-size: 11px; font-weight: 700; letter-spacing: 0.2em; color: #93A0B7; margin-top: 3px; }
  .specimen.light .word .name { color: #131A2B; }
  .lbl { font-size: 11px; font-weight: 700; color: #59647d; letter-spacing: 0.04em; }
  .sizes { display: flex; align-items: flex-end; gap: 18px; }
  .sizecol { display: flex; flex-direction: column; align-items: center; gap: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="kicker">Brand · Logo</div>
    <h1 class="th">ทิศทางโลโก้ใหม่</h1>
    <p class="sub">ให้อ่านออกว่าเป็น <b>แพลตฟอร์มบอร์ดเกม</b> ภายใน 3 วินาที — เลือกอันที่ชอบ แล้วผมจะนำไปใช้ทั้งแอป</p>
  </div>
  <div class="grid" id="grid"></div>
</div>

<script>
const GRAD = 'linear-gradient(140deg, #8B7BFF 0%, #6D5EF9 45%, #00D4FF 130%)';
const WARM = 'linear-gradient(140deg, #FFB65C, #FF8E3C 60%, #FF6B4D)';

// ── marks: each returns an <svg> string sized to `s`, drawn on a gradient tile separately
const MARKS = {
  // A — round table, top-down, with seats + center cards (literal ตั้งวง)
  table(s){return `<svg viewBox="0 0 40 40" width="${s}" height="${s}">
    <circle cx="20" cy="20" r="14.5" fill="rgba(0,0,0,0.16)" stroke="#fff" stroke-width="1.5" stroke-opacity="0.55"/>
    ${[...Array(6)].map((_,i)=>{const a=(-90+i*60)*Math.PI/180;return `<circle cx="${20+12.3*Math.cos(a)}" cy="${20+12.3*Math.sin(a)}" r="2.5" fill="#fff"/>`}).join('')}
    <g transform="translate(20,21.5)">
      <rect x="-4.5" y="-7.5" width="9" height="11.5" rx="1.8" fill="#fff" opacity="0.8" transform="rotate(-20)"/>
      <rect x="-4.5" y="-8" width="9" height="11.5" rx="1.8" fill="#fff" transform="rotate(20)"/>
    </g></svg>`;},

  // B — fanned playing cards
  cards(s){return `<svg viewBox="0 0 40 40" width="${s}" height="${s}">
    <g transform="translate(20,25)">
      <rect x="-7" y="-15" width="14" height="20" rx="2.6" fill="#fff" opacity="0.62" transform="rotate(-26)"/>
      <rect x="-7" y="-16" width="14" height="20" rx="2.6" fill="#fff" opacity="0.82" transform="rotate(0)"/>
      <rect x="-7" y="-15" width="14" height="20" rx="2.6" fill="#fff" opacity="0.62" transform="rotate(26)"/>
      <circle cx="0" cy="-8" r="3.1" fill="#6D5EF9"/>
    </g></svg>`;},

  // C — die (d6) showing 5
  die(s){const p=[[12,12],[28,12],[20,20],[12,28],[28,28]];return `<svg viewBox="0 0 40 40" width="${s}" height="${s}">
    <g transform="rotate(-9 20 20)">
      <rect x="8.5" y="8.5" width="23" height="23" rx="6" fill="#fff"/>
      ${p.map(([x,y])=>`<circle cx="${x}" cy="${y}" r="2.7" fill="#6D5EF9"/>`).join('')}
    </g></svg>`;},

  // D — meeple (the universal board-game pawn) inside the gathering circle
  meeple(s){return `<svg viewBox="0 0 40 40" width="${s}" height="${s}">
    <circle cx="20" cy="20" r="14.5" fill="none" stroke="#fff" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="2.5 3"/>
    <circle cx="20" cy="12.5" r="4.1" fill="#fff"/>
    <path d="M20 17
      c-2.2 0-4 1.4-4.7 3.4 l-4 1.5 c-1 .38-1.5 1.5-1.1 2.5 .38 1 1.5 1.5 2.5 1.1 l2.8-1.05
      c-.16 .7-.25 1.45-.25 2.2 0 .95 .12 1.86 .35 2.7 l-1.0 3.0 c-.3 .9 .37 1.85 1.32 1.85 h1.7
      l1.2-3.1 c.5 .08 1.0 .12 1.5 .12 s1.0-.04 1.5-.12 l1.2 3.1 h1.7 c.95 0 1.62-.95 1.32-1.85 l-1.0-3.0
      c.23-.84 .35-1.75 .35-2.7 0-.75-.09-1.5-.25-2.2 l2.8 1.05 c1 .4 2.12-.1 2.5-1.1 .4-1-.1-2.12-1.1-2.5
      l-4-1.5 c-.7-2.0-2.5-3.4-4.7-3.4z" fill="#fff"/>
    </svg>`;},
};

const OPTIONS = [
  ['meeple', 'Meeple in the Circle', 'หมาก meeple — สัญลักษณ์สากลของบอร์ดเกมยุคใหม่ ล้อมด้วยวงประ = ตั้งวง อ่านออกทันทีว่าเป็นบอร์ดเกม', GRAD, true],
  ['table', 'รอบโต๊ะ · Round Table', 'มุมมองจากบนโต๊ะ มีที่นั่งล้อมรอบและไพ่ตรงกลาง — สื่อ "เพื่อนล้อมวงเล่นเกม" ตรงตัวที่สุด', GRAD, false],
  ['cards', 'ไพ่คลี่ · Fanned Cards', 'ไพ่สามใบคลี่ออก — สื่อการ์ดเกม/ปาร์ตี้เกมชัดเจน เรียบและสเกลเล็กได้ดี', GRAD, false],
  ['die', 'ลูกเต๋า · Dice', 'ลูกเต๋าหน้า 5 เอียงเล็กน้อย — ไอคอนเกมคลาสสิก คมชัดทุกขนาด', WARM, false],
];

document.getElementById('grid').innerHTML = OPTIONS.map(([key, name, desc, grad, pick]) => `
  <div class="card ${pick?'pick':''}">
    <div class="card-top">
      <div>
        <div class="opt-name th">${name}</div>
      </div>
      ${pick?'<span class="badge">แนะนำ</span>':''}
    </div>
    <div class="opt-desc th">${desc}</div>
    <div class="specimen">
      <div class="sizes">
        <div class="sizecol">
          <div class="tile" style="width:84px;height:84px;background:${grad}">${center(MARKS[key](84),84)}</div>
          <span class="lbl">App icon</span>
        </div>
        <div class="sizecol">
          <div class="tile" style="width:44px;height:44px;background:${grad};border-radius:30%">${center(MARKS[key](44),44)}</div>
          <span class="lbl">44px</span>
        </div>
        <div class="sizecol">
          <div class="tile" style="width:28px;height:28px;background:${grad};border-radius:32%">${center(MARKS[key](28),28)}</div>
          <span class="lbl">28px</span>
        </div>
      </div>
    </div>
    <div class="specimen">
      <div class="lockup">
        <div class="tile" style="width:40px;height:40px;background:${grad};border-radius:30%">${center(MARKS[key](40),40)}</div>
        <div class="word"><span class="name th">ตั้งวง</span><span class="en">TANGWONG</span></div>
      </div>
    </div>
    <div class="specimen light">
      <div class="lockup">
        <div class="tile" style="width:40px;height:40px;background:${grad};border-radius:30%">${center(MARKS[key](40),40)}</div>
        <div class="word"><span class="name th">ตั้งวง</span><span class="en">TANGWONG</span></div>
      </div>
    </div>
  </div>
`).join('');

function center(svg, s){ return `<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center">${svg}</div>`; }
</script>
</body>
</html>
