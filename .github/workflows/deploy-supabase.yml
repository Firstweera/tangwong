# Redeploy the Supabase Edge Functions whenever code they import lands on main
# (.ai/supabase.md §6). The gate must pass first. Database migrations are NOT
# applied here — they stay manual; this workflow only warns when one changed.
#
# Repository secrets required:
#   SUPABASE_ACCESS_TOKEN  scoped token (TangWong project, Edge Functions write)
#   SUPABASE_PROJECT_REF   project ref (e.g. abcdefghijklmnopqrst)
name: Deploy Supabase functions

on:
  push:
    branches: [main]
    paths:
      - 'src/features/games/**'
      - 'src/types/**'
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - '.github/workflows/deploy-supabase.yml'
  workflow_dispatch:

permissions:
  contents: read

# Never run two deploys at once; never cancel one half-way.
concurrency:
  group: deploy-supabase
  cancel-in-progress: false

jobs:
  gate:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy Edge Functions
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::Set SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF in Settings → Secrets and variables → Actions."
            exit 1
          fi

      - uses: supabase/setup-cli@v3
        with:
          version: 2.107.0

      - name: Deploy game-start
        run: supabase functions deploy game-start --project-ref "$SUPABASE_PROJECT_REF" --use-api
      - name: Deploy game-action
        run: supabase functions deploy game-action --project-ref "$SUPABASE_PROJECT_REF" --use-api

      - name: Warn about manual migrations
        if: github.event_name == 'push'
        run: |
          changed=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- supabase/migrations 2>/dev/null || true)
          if [ -n "$changed" ]; then
            echo "::warning::Migrations changed but were NOT applied (manual step, see .ai/supabase.md §5): $changed"
            { echo "### ⚠️ Migrations not applied"; echo; echo '```'; echo "$changed"; echo '```'; echo "Apply them by hand before relying on this deploy."; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Summary
        run: |
          {
            echo "### Edge Functions deployed"
            echo "- commit: \`${{ github.sha }}\`"
            echo "- functions: \`game-start\`, \`game-action\`"
          } >> "$GITHUB_STEP_SUMMARY"
